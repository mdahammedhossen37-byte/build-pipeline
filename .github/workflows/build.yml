name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip newest project zip
        run: |
          ls -l *.zip
          ZIP=$(ls dudhia*.zip | sort -V | tail -1)
          echo "Using $ZIP"
          rm -rf dudhia
          unzip -q "$ZIP"
          grep versionName dudhia/app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p dudhia testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dudhia-apk-run-${{ github.run_number }}
          path: dudhia/app/build/outputs/apk/debug/*.apk
